[project]
name = "crashx"
version = "0.5.6"
description = "Disposable traffic crash information-exchange PDF application"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "reportlab>=4.2,<5",
  "zxing-cpp>=3.1.1,<4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
